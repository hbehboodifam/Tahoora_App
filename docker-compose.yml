version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: OrderManagementApi/Dockerfile
    ports:
      - "5000:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=db;Database=OrderManagement;User=root;Password=13681370Hb@;
    depends_on:
      - db

  app:
    build:
      context: .
      dockerfile: OrderManagementApp/Dockerfile
    ports:
      - "5001:80"

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: 13681370Hb@
      MYSQL_DATABASE: OrderManagement
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data: